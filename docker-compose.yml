# Local development: a Postgres database, and optionally the app itself.
#
#   docker compose up -d postgres      # database only (then `npm run dev`)
#   docker compose --profile app up    # database + production build of the app
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventiphy_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    profiles: ['app']
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eventiphy_dev
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Local only. Use a long random value in any real deployment.
      NEXTAUTH_SECRET: local-development-secret-change-me
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
