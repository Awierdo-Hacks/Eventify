<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 56" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Location pin — Lucide-style outline, geen achtergrondvorm -->
  <path d="M24 4C17 4 11.5 9.1 11.5 15.5 11.5 24 24 40 24 40S36.5 24 36.5 15.5C36.5 9.1 31 4 24 4z" 
