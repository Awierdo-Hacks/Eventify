        fill="url(#pinGrad)"/>

  <!-- "Eventiphy" text with gradient -->
  <text x="62" y="36" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="url(#brandGrad)" letter-spacing="-0.5">
    Eventiphy
  </text>
</svg>
