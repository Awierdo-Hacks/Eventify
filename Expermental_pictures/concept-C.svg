<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="60" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- === ICOON: Elegante outline pin met sierlijke poolster === -->
  <g transform="translate(10, 4)">
    <!-- Pin — alleen outline, dunne lijn, Lucide-achtige stijl -->
    <path d="M30 5C20 5 12 12.5 12 22C12 33.5 30 56 30 56S48 33.5 48 22C48 12.5 40 5 30 5Z"
          stroke="url(#grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Elegante 4-puntige poolster — dunnere, langere punten, premium gevoel -->
    <path d="M30 10 L31.5 19 L40 22 L31.5 25 L30 34 L28.5 25 L20 22 L28.5 19 Z"
          stroke="url(#grad)" stroke-width="1.2" stroke-linejoin="round" fill="none"/>

    <!-- Kleine diamant in het midden voor schittering -->
    <path d="M30 20 L31 22 L30 24 L29 22 Z" fill="url(#grad)" opacity="0.6"/>
  </g>

  <!-- === TEKST: "Eventiphy" — lichtgewicht, elegant === -->
  <!-- "Event" in donker, medium weight -->
  <text x="72" y="47" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif"
        font-size="34" font-weight="500" letter-spacing="0" fill="#2d2455">Event</text>

  <!-- "iphy" in gradient, bolder -->
  <text x="163" y="47" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif"
        font-size="34" font-weight="700" letter-spacing="0" fill="url(#textGrad)">iphy</text>

  <!-- Subtiele dunne accent lijn — gradient -->
  <line x1="72" y1="55" x2="225" y2="55" stroke="url(#textGrad)" stroke-width="1.8" stroke-linecap="round"/>
</svg>
