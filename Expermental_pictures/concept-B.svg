<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="60%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="60%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- === ICOON: Bredere, robuustere pin met dominante poolster === -->
  <g transform="translate(8, 2)">
    <!-- Pin — breder, ronder bovenlichaam, kortere punt voor uniekere vorm -->
    <path d="M32 2C19 2 9 11.5 9 23C9 30 14 38 22 47C26 51.5 30 55 32 57C34 55 38 51.5 42 47C50 38 55 30 55 23C55 11.5 45 2 32 2Z"
          fill="url(#pinGrad)"/>

    <!-- Grote dominante 4-puntige poolster — vult de pin meer -->
    <path d="M32 9 L35 19.5 L45 23 L35 26.5 L32 37 L29 26.5 L19 23 L29 19.5 Z"
          fill="white"/>

    <!-- Glow effect achter de ster -->
    <circle cx="32" cy="23" r="8" fill="white" opacity="0.12"/>
  </g>

  <!-- === TEKST: "Eventiphy" — bold, strak === -->
  <!-- "Event" in donker -->
  <text x="74" y="46" font-family="'Segoe UI', 'Inter', 'Poppins', sans-serif"
        font-size="34" font-weight="800" letter-spacing="-1" fill="#1a1235">Event</text>

  <!-- "iphy" in gradient -->
  <text x="166" y="46" font-family="'Segoe UI', 'Inter', 'Poppins', sans-serif"
        font-size="34" font-weight="800" letter-spacing="-1" fill="url(#textGrad)">iphy</text>

  <!-- Dikke accent lijn — gradient, afgeronde caps -->
  <line x1="74" y1="55" x2="228" y2="55" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round"/>
</svg>
