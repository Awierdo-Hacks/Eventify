name: Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Notify Render to deploy
        run: |
          echo "🚀 Deployment triggered to Render"
          echo "📍 Branch: ${{ github.ref_name }}"
          echo "💾 Commit: ${{ github.sha }}"
          echo ""
          echo "Render will automatically:"
          echo "1. Pull latest code"
          echo "2. Build Docker image"
          echo "3. Run database migrations"
          echo "4. Deploy to production"
          echo ""
          echo "Monitor deployment: https://dashboard.render.com"
      
      # Optioneel: Trigger Render webhook
      # - name: Trigger Render Deploy Hook
      #   run: |
      #     curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      
      - name: Create deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Deploying to Render'
            });
            
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              log_url: `https://dashboard.render.com`,
              description: 'Deployment in progress on Render'
            });
